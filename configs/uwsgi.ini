# d1 vendor reset — uwsgi config (production; pair with nginx.division1.conf)
#
# service.py is a WSGI app (module-level `app`, see its docstring) on top of the
# same route() the built-in stdlib server uses. No Python deps beyond stdlib —
# uwsgi is installed system-wide (e.g. pip install uwsgi, or the distro package)
# and .venv is left stdlib-only on purpose (AI_CONTEXT §6).
#
#   uwsgi --ini configs/uwsgi.ini            # test run from the project root
#
# Production (systemd):
#   [Service]
#   WorkingDirectory=/opt/d1-vendor-reset
#   ExecStart=/usr/local/bin/uwsgi --ini configs/uwsgi.ini
#   Restart=always
#
# Notes:
#  - process=1 + single thread: a sync must never run twice in parallel;
#    POST /sync answers 202 and does the actual sync in a background thread.
#  - The weekly sync is not started on boot: the first POST /sync (or a cron
#    `curl -X POST http://127.0.0.1:8090/sync` in this same style) starts it.
#    If you want it automatic, uncomment start-sync below.
#  - logging to file; uwsgi access log goes to the same file unless disabled.

[uwsgi]
module = service
callable = app
chdir = /opt/d1-vendor-reset
# chdir = %(here)                    # or: run from the checkout, no absolute path
virtualenv = /opt/d1-vendor-reset/.venv
# virtualenv = %(here)/.venv
pyargv =
master = true
processes = 1
threads = 2
listen = 100
http = 127.0.0.1:8090               # only nginx may reach this port
# enable-threads = true             # only if you raise threads > 1
vacuum = true
# start-sync = true                 # optional: start the weekly sync on boot
buffer-size = 65535
http-timeout = 120                 # POST /sync is instant, sync runs in a thread
daemonize = false                  # systemd: false; manual `uwsgi --ini` runs: false
logto = /var/log/d1-vendor-reset/uwsgi.log
# disable-logging = true            # uncomment when forwarding to syslog instead
pidfile = /run/d1-vendor-reset/uwsgi.pid
uid = www-data
gid = www-data
