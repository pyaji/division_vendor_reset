# d1 vendor reset — nginx config (full file: nginx -t -c configs/nginx.division1.conf)
#
# Layout: one root = the project checkout. Everything the front end needs
# (css/js/images/fonts/data/*.json) is static and served straight from disk;
# only the JSON API and POST /sync go through uwsgi — and those files are
# identical, so the front end never notices the split.
#
# The front end is deployed under the /divn/ prefix (HARD RULE, AI_CONTEXT §4.7):
# css/*.css reference assets with the absolute /divn/ prefix, and index.html
# fetches data/ relatively (i.e. /divn/data/...) — so the location below must
# keep that exact prefix.
#
#   server_name  example.com   ->  /divn/            (the page)
#                    /status, /data/*.json           (uwsgi, via 127.0.0.1:8090)
#
# Production (systemd):
#   [Install] WantedBy=multi-user.target  (nginx.service), unit for uwsgi --ini
#   ConfigTest: nginx -t -c /opt/d1-vendor-reset/configs/nginx.division1.conf
#   Note: with -c this file is the ONLY config (it contains its own events{}
#   block); to merge into an existing setup, copy the `server {}` block into
#   /etc/nginx/conf.d/ and drop the events{}/http{} wrappers.

user  www-data;
worker_processes  2;
pid   /run/nginx-d1.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    access_log  /var/log/nginx/d1-access.log;
    error_log   /var/log/nginx/d1-error.log;

    sendfile      on;
    tcp_nopush    on;
    keepalive_timeout  65;

    server {
        listen 80;
        server_name example.com;

        root /opt/d1-vendor-reset;      # the project checkout (same root uwsgi uses)

        # the page: index.html + all assets under the /divn/ prefix
        location /divn/ {
            index index.html;
            # data refreshes weekly — never serve a stale copy
            location ~* \.(?:html|json)$ {
                add_header Cache-Control "no-cache";
            }
            location ~* \.(?:css|js|vue|png|jpg|jpeg|gif|svg|webp|ttf|otf|woff2?)$ {
                expires 7d;
                add_header Cache-Control "public";
            }
        }
        # /divn -> /divn/  (mirrors the service's own 301)
        location = /divn {
            return 301 /divn/;
        }

        # JSON API + sync: same files the page fetches, but always live
        location = /status {
            proxy_pass http://127.0.0.1:8090;
        }
        location /data/ {
            proxy_pass http://127.0.0.1:8090;
            add_header Cache-Control "no-cache";
        }
        location = /sync {
            proxy_pass http://127.0.0.1:8090;
            # the sync runs in a background thread; this stays a fast request
            proxy_read_timeout 30s;
        }
        location = / {
            proxy_pass http://127.0.0.1:8090;   # JSON index of the endpoints
        }

        # everything else: no dotfiles, no service sources (matches the
        # service's own static filter)
        location ~ /\.(?!well-known) {
            deny all;
        }
        location = /service.py {
            return 404;
        }
    }
}
